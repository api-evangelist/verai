name: VerAI
description: VerAI Discoveries is an AI-driven mineral discovery company founded in 2020 and
  headquartered in Boston, Massachusetts. Its proprietary AI/ML Discovery Platform searches
  magnetic, gravimetric, electromagnetic, and seismic geophysical datasets to detect concealed
  mineral deposits in underexplored covered terrain, generating drill-ready targets across a
  portfolio of more than sixty mineral projects and royalties in North and South America. VerAI
  partners with explorers and investors to develop critical-mineral assets essential to the
  green-energy transition. The company is backed by Insight Partners, Blumberg Capital, Chrysalix
  Venture Capital, and Orion Industrial Ventures, and to date exposes no public developer API surface.
